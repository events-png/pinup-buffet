<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pin-up | Buffetauswahl</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>pin-up Buffetauswahl</h1>
  <p id="meldung">Veranstaltung wird geladen ...</p>
  <div id="veranstaltung"></div>

  <script>
    const SUPABASE_URL = "https://gfhvecfpdfftfkidlfjc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jB82z-cp1ZCZdZRdaRBBig_QA1d4mft";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function ladeVeranstaltung() {
      const token = new URLSearchParams(
        window.location.search
      ).get("token");

      const meldung = document.getElementById("meldung");

      if (!token) {
        meldung.textContent = "Kein Veranstaltungslink angegeben.";
        return;
      }

      const { data, error } = await db.rpc(
        "get_event_by_token",
        { p_token: token }
      );

      if (error || !data || data.length === 0) {
        meldung.textContent = "Veranstaltung nicht gefunden.";
        return;
      }

      meldung.textContent = "Ihre Veranstaltung:";

      const titel = document.createElement("h2");
      titel.textContent = data[0].customer_name;

      document.getElementById("veranstaltung")
        .appendChild(titel);
    }
async function ladeBuffet() {
  const { data, error } = await db.rpc("get_buffet_items");

  if (error) {
    alert("Buffet konnte nicht geladen werden.");
    return;
  }

  const bereich = document.getElementById("veranstaltung");

  for (const kategorie of ["Vorspeise", "Hauptgericht", "Beilage", "Dessert"]) {
    const titel = document.createElement("h3");
    titel.textContent = kategorie;
    bereich.appendChild(titel);

    data.filter(item => item.category === kategorie)
      .forEach(item => {
        const zeile = document.createElement("label");
zeile.style.display = "block";
zeile.style.margin = "10px 0";

const checkbox = document.createElement("input");
checkbox.type = "checkbox";
checkbox.value = item.id;
checkbox.className = "buffet-auswahl";

zeile.appendChild(checkbox);
zeile.appendChild(
  document.createTextNode(" " + item.name)
);

bereich.appendChild(zeile);
      });
  }
}
   ladeVeranstaltung().then(ladeBuffet);
  </script>
</body>
</html>
