<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>pin-up | Buffetauswahl</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

   body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f7f7f7;
  color: #222;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
    /* FESTER KOPFBEREICH */

    #kopfbereich {
     position: relative;
flex-shrink: 0;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 24px;
      background: #ffffff;
      z-index: 1000;
      border-bottom: 3px solid #fbbf24;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    #kopfbereich h1 {
      margin: 5px 0;
      font-size: 24px;
    }

    #kopfbereich p {
      margin: 5px 0;
    }

    #veranstaltung h2 {
      margin: 8px 0;
      font-size: 20px;
    }

    /* AUSWAHLZÄHLER */

    #auswahlzaehler {
      background: #fff8df;
      padding: 10px 15px;
      margin: 10px auto 0;
      border-radius: 8px;
      max-width: 800px;
      line-height: 1.5;
      border: 1px solid #fbbf24;
    }

    #zaehlerinhalt {
      margin-top: 5px;
    }

    /* BUFFET */

    #buffet {
  flex: 1;
  overflow-y: auto;
  padding: 15px 25px 50px;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
}

    h3 {
      margin-top: 30px;
      border-bottom: 2px solid #fbbf24;
      padding-bottom: 8px;
    }

    label {
      display: block;
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e5e5e5;
    }

    label:hover {
      background: #fff8df;
    }

    input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    /* HANDYANSICHT */

    @media (max-width: 600px) {

      #kopfbereich {
        padding: 10px;
      }

      #kopfbereich h1 {
        font-size: 20px;
      }

      #veranstaltung h2 {
        font-size: 17px;
      }

      #auswahlzaehler {
        font-size: 13px;
      }

      body {
        padding: 12px;
      }

    }
  </style>

</head>

<body>

  <!-- FESTER KOPFBEREICH -->

  <header id="kopfbereich">

    <h1>pin-up Buffetauswahl</h1>

    <p id="meldung">
      Veranstaltung wird geladen ...
    </p>

    <div id="veranstaltung"></div>

    <div id="auswahlzaehler" hidden>

      <strong>Ihre Auswahl</strong>

      <div id="zaehlerinhalt"></div>

    </div>

  </header>


  <!-- BUFFET-GERICHTE -->

  <main id="buffet"></main>


  <script>

    /* SUPABASE */

    const SUPABASE_URL =
      "https://gfhvecfpdfftfkidlfjc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_jB82z-cp1ZCZdZRdaRBBig_QA1d4mft";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* ZUGANGSCODE */
let gaestezahl = 0;
    const token = new URLSearchParams(
      window.location.search
    ).get("token");


    /* VERANSTALTUNG LADEN */

    async function ladeVeranstaltung() {

      const meldung = document.getElementById("meldung");

      if (!token) {

        meldung.textContent =
          "Kein Veranstaltungslink angegeben.";

        return false;
      }

      const { data, error } = await db.rpc(
        "get_event_by_token",
        {
          p_token: token
        }
      );

      if (error || !data || data.length === 0) {

        meldung.textContent =
          "Veranstaltung nicht gefunden.";

        return false;
      }

      const event = data[0];
      gaestezahl = Number(event.guest_count) || 0;

      meldung.textContent = "Ihre Veranstaltung:";

      const titel = document.createElement("h2");

      titel.textContent = event.customer_name;

      document.getElementById("veranstaltung")
        .appendChild(titel);

      return true;
    }


    /* BUFFET LADEN */

    async function ladeBuffet() {

      const { data, error } = await db.rpc(
        "get_buffet_items"
      );

      if (error) {

        alert("Buffet konnte nicht geladen werden.");

        return;
      }

      const bereich = document.getElementById("buffet");

      bereich.replaceChildren();

      const kategorien = [
        "Vorspeise",
        "Hauptspeise",
        "Beilage",
        "Dessert"
      ];

      for (const kategorie of kategorien) {

        const titel = document.createElement("h3");

        titel.textContent = kategorie;

        bereich.appendChild(titel);

        const gerichte = data.filter(item =>
          item.category?.trim().toLowerCase() ===
          kategorie.toLowerCase()
        );

        gerichte.forEach(item => {

          const zeile = document.createElement("label");

          const checkbox = document.createElement("input");

          checkbox.type = "checkbox";

          checkbox.value = item.id;

          checkbox.className = "buffet-auswahl";

          checkbox.dataset.category =
            item.category.trim().toLowerCase();

          checkbox.addEventListener(
            "change",
            aktualisiereAuswahl
          );

          zeile.appendChild(checkbox);

          zeile.appendChild(
            document.createTextNode(" " + item.name)
          );

          bereich.appendChild(zeile);

        });

      }

      document.getElementById("auswahlzaehler").hidden = false;

      aktualisiereAuswahl();
    }


    /* AUSWAHL ZÄHLEN */

    function aktualisiereAuswahl() {

  const auswahl = document.querySelectorAll(
    ".buffet-auswahl:checked"
  );

  const anzahl = {
    vorspeise: 0,
    hauptspeise: 0,
    beilage: 0,
    dessert: 0
  };

  auswahl.forEach(item => {
    const kategorie = item.dataset.category;

    if (kategorie in anzahl) {
      anzahl[kategorie]++;
    }
  });

  const aufpreis =
    Math.max(0, anzahl.vorspeise - 4) * 5 +
    Math.max(0, anzahl.hauptspeise - 2) * 6.5 +
    Math.max(0, anzahl.beilage - 3) * 5 +
    Math.max(0, anzahl.dessert - 1) * 5;

  const preisProPerson = 31.50 + aufpreis;
  const gesamtpreis = preisProPerson * gaestezahl;

  const euro = wert =>
    wert.toLocaleString("de-DE", {
      style: "currency",
      currency: "EUR"
    });

  document.getElementById("zaehlerinhalt").innerHTML = `
    Vorspeisen: ${anzahl.vorspeise}/4 |
    Hauptspeisen: ${anzahl.hauptspeise}/2<br>

    Beilagen: ${anzahl.beilage}/3 |
    Desserts: ${anzahl.dessert}/1

    <hr>

    Grundpreis: ${euro(31.50)} pro Person<br>
    Aufpreis: ${euro(aufpreis)} pro Person<br>

    <strong>
      Preis pro Person: ${euro(preisProPerson)}<br>
      Gesamtpreis: ${euro(gesamtpreis)}
    </strong>
  `;
}

    /* KOPFBEREICH AUTOMATISCH BERÜCKSICHTIGEN */

    function aktualisiereAbstand() {

      const kopfbereich = document.getElementById(
        "kopfbereich"
      );

      const buffet = document.getElementById(
        "buffet"
      );

      buffet.style.paddingTop =
        (kopfbereich.offsetHeight + 20) + "px";

    }


    /* SEITE STARTEN */

    async function starten() {

      const gefunden = await ladeVeranstaltung();

      if (gefunden) {

        await ladeBuffet();

      }

      aktualisiereAbstand();

    }


   

    starten();

  </script>

</body>
</html>
