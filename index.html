<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pin-up | Buffetauswahl</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#222}
    header{position:sticky;top:0;background:#fff;border-bottom:3px solid #fbbf24;padding:10px 18px;text-align:center;z-index:5;box-shadow:0 2px 8px #0001}
    h1{margin:2px 0;font-size:24px} #veranstaltung h2{margin:5px 0;font-size:20px}
    #auswahlzaehler{background:#fff8df;padding:9px 12px;margin:8px auto 0;border-radius:8px;max-width:850px;border:1px solid #fbbf24;line-height:1.45}
    #preise{padding-top:5px;margin-top:5px;border-top:1px solid #e5c75c}
    #speichern{margin-top:7px;padding:8px 18px;border:0;border-radius:6px;background:#fbbf24;font-weight:bold;cursor:pointer}
    #speichern:disabled{opacity:.5} #speicherstatus{margin-top:6px;font-weight:bold}
    main{max-width:850px;margin:auto;padding:8px 20px 50px} h3{margin:22px 0 8px;border-bottom:2px solid #fbbf24;padding-bottom:7px}
    label.item{display:flex;align-items:center;gap:10px;padding:11px;margin:7px 0;background:#fff;border:1px solid #e5e5e5;border-radius:6px}
    label.item:hover{background:#fff8df} input[type=checkbox]{transform:scale(1.2)}
    input.menge{width:85px;padding:7px;border:1px solid #bbb;border-radius:5px;margin-left:auto}
    @media(max-width:600px){h1{font-size:19px}#veranstaltung h2{font-size:16px}header{padding:7px}#auswahlzaehler{font-size:12px}main{padding:5px 12px 40px}}
  </style>
</head>
<body>
<header>
  <h1>pin-up Buffetauswahl</h1>
  <p id="meldung">Veranstaltung wird geladen ...</p>
  <div id="veranstaltung"></div>
  <div id="auswahlzaehler" hidden>
    <strong>Ihre Auswahl</strong>
    <div id="auswahlmengen"></div>
    <div id="preise"></div>
    <button id="speichern" onclick="speichereAuswahl()">Auswahl speichern</button>
    <div id="speicherstatus"></div>
  </div>
</header>
<main id="buffet"></main>
<script>
const db=supabase.createClient("https://gfhvecfpdfftfkidlfjc.supabase.co","sb_publishable_jB82z-cp1ZCZdZRdaRBBig_QA1d4mft");
const token=new URLSearchParams(location.search).get("token");
let eventData=null, items=[], geschlossen=false;

const euro=v=>Number(v||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const datum=d=>d?new Date(d+"T00:00:00").toLocaleDateString("de-DE"):"-";

async function ladeVeranstaltung(){
  if(!token){document.getElementById("meldung").textContent="Kein Veranstaltungslink angegeben.";return false}
  const {data,error}=await db.rpc("get_event_by_token",{p_token:token});
  if(error||!data?.length){document.getElementById("meldung").textContent="Veranstaltung nicht gefunden.";return false}
  eventData=data[0];
  const now=new Date(), today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  geschlossen=eventData.status!=="open"||(eventData.buffet_deadline&&eventData.buffet_deadline<today);
  document.getElementById("meldung").textContent=eventData.buffet_name||"Ihre Veranstaltung";
  const h=document.createElement("h2");
  h.append(document.createTextNode(eventData.customer_name||"Veranstaltung"));
  const sub=document.createElement("div"); sub.style.cssText="font-size:14px;font-weight:normal;margin-top:4px";
  sub.textContent="Veranstaltung: "+datum(eventData.event_date)+" | Auswahl möglich bis: "+datum(eventData.buffet_deadline);
  h.appendChild(sub); document.getElementById("veranstaltung").replaceChildren(h);
  return true;
}

async function ladeBuffet(){
  const {data,error}=await db.rpc("get_buffet_items_for_token",{p_token:token});
  if(error){document.getElementById("meldung").textContent="Buffet konnte nicht geladen werden.";return}
  items=data||[];
  const main=document.getElementById("buffet"); main.replaceChildren();
  if(eventData.selection_type==="quantity") baueMengenAuswahl(main); else baueNormaleAuswahl(main);
  await ladeGespeichert();
  document.getElementById("auswahlzaehler").hidden=false;
  aktualisiere();
  if(geschlossen){
    document.querySelectorAll("input").forEach(x=>x.disabled=true);
    document.getElementById("speichern").style.display="none";
    document.getElementById("speicherstatus").textContent="Die Auswahlfrist ist abgelaufen. Änderungen sind nicht mehr möglich.";
  }
}

function gruppiert(){
  const m=new Map();
  items.forEach(i=>{if(!m.has(i.category))m.set(i.category,[]);m.get(i.category).push(i)});
  return m;
}

function titel(main,name){const h=document.createElement("h3");h.textContent=name;main.appendChild(h)}

function baueNormaleAuswahl(main){
  for(const [cat,list] of gruppiert()){
    titel(main,cat);
    list.forEach(item=>{
      const l=document.createElement("label");l.className="item";
      const cb=document.createElement("input");cb.type="checkbox";cb.value=item.id;cb.className="buffet-auswahl";cb.dataset.category=(item.category||"").toLowerCase();
      cb.onchange=()=>{aktualisiere();document.getElementById("speicherstatus").textContent=""};
      const span=document.createElement("span");span.textContent=item.name+(item.vegan&&!item.name.includes("(V)")?" (V)":"");
      l.append(cb,span);main.appendChild(l);
    });
  }
}

function baueMengenAuswahl(main){
  titel(main,"Fingerfood");
  items.forEach(item=>{
    const l=document.createElement("label");l.className="item";
    const span=document.createElement("span");span.textContent=item.name;
    const n=document.createElement("input");n.type="number";n.min="0";n.step="10";n.value="0";n.className="menge";n.dataset.id=item.id;
    n.setAttribute("aria-label","Stückzahl "+item.name);
    n.onchange=()=>{if(Number(n.value)>0&&Number(n.value)<Number(eventData.minimum_quantity_per_item||10))n.value=eventData.minimum_quantity_per_item||10;aktualisiere();document.getElementById("speicherstatus").textContent=""};
    l.append(span,n);main.appendChild(l);
  });
}

async function ladeGespeichert(){
  const {data}=await db.rpc("get_buffet_selection_details",{p_token:token});
  if(!data)return;
  if(eventData.selection_type==="quantity"){
    data.forEach(s=>{const n=document.querySelector('.menge[data-id="'+s.buffet_item_id+'"]');if(n)n.value=s.quantity});
  }else{
    const ids=data.map(s=>Number(s.buffet_item_id));
    document.querySelectorAll(".buffet-auswahl").forEach(cb=>cb.checked=ids.includes(Number(cb.value)));
  }
  if(data.length)document.getElementById("speicherstatus").textContent="Gespeicherte Auswahl geladen.";
}

function aktualisiere(){
  if(eventData.selection_type==="quantity"){aktualisiereMengen();return}
  const counts={vorspeise:0,hauptspeise:0,beilage:0,dessert:0};
  document.querySelectorAll(".buffet-auswahl:checked").forEach(x=>{if(x.dataset.category in counts)counts[x.dataset.category]++});
  const inc={vorspeise:Number(eventData.included_appetizers||0),hauptspeise:Number(eventData.included_main_courses||0),beilage:Number(eventData.included_sides||0),dessert:Number(eventData.included_desserts||0)};
  const extra={
    vorspeise:Math.max(0,counts.vorspeise-inc.vorspeise),
    hauptspeise:Math.max(0,counts.hauptspeise-inc.hauptspeise),
    beilage:Math.max(0,counts.beilage-inc.beilage),
    dessert:Math.max(0,counts.dessert-inc.dessert)
  };
  const surcharge=extra.vorspeise*Number(eventData.extra_appetizer_price||0)+extra.hauptspeise*Number(eventData.extra_main_course_price||0)+extra.beilage*Number(eventData.extra_side_price||0)+extra.dessert*Number(eventData.extra_dessert_price||0);
  const pp=Number(eventData.base_price_per_person||0)+surcharge;
  document.getElementById("auswahlmengen").textContent=
    "Vorspeisen: "+counts.vorspeise+" von "+inc.vorspeise+" inklusive | Hauptspeisen: "+counts.hauptspeise+" von "+inc.hauptspeise+" inklusive | Beilagen: "+counts.beilage+" von "+inc.beilage+" inklusive | Desserts: "+counts.dessert+" von "+inc.dessert+" inklusive";
  document.getElementById("preise").innerHTML="Grundpreis: "+euro(eventData.base_price_per_person)+" p. P.<br>Preis pro Person: <strong>"+euro(pp)+"</strong> | "+eventData.guest_count+" Personen: <strong>"+euro(pp*Number(eventData.guest_count||0))+"</strong>";
}

function aktualisiereMengen(){
  let total=0,sorten=0;
  document.querySelectorAll(".menge").forEach(n=>{const q=Math.max(0,Number(n.value)||0);if(q>0){total+=q;sorten++}});
  const minTotal=Number(eventData.minimum_total_quantity||30), minItem=Number(eventData.minimum_quantity_per_item||10), unit=Number(eventData.unit_price||0);
  document.getElementById("auswahlmengen").textContent="Ausgewählte Sorten: "+sorten+" | Stück gesamt: "+total+" (mindestens "+minTotal+") | mindestens "+minItem+" Stück je gewählter Sorte";
  document.getElementById("preise").innerHTML="Preis pro Stück: "+euro(unit)+" | Gesamt: <strong>"+euro(total*unit)+"</strong>";
}

async function speichereAuswahl(){
  const btn=document.getElementById("speichern"),status=document.getElementById("speicherstatus");
  btn.disabled=true;status.textContent="Auswahl wird gespeichert ...";
  let result;
  if(eventData.selection_type==="quantity"){
    const ids=[],qty=[];
    document.querySelectorAll(".menge").forEach(n=>{const q=Number(n.value)||0;if(q>0){ids.push(Number(n.dataset.id));qty.push(q)}});
    const minTotal=Number(eventData.minimum_total_quantity||30),minItem=Number(eventData.minimum_quantity_per_item||10);
    if(qty.reduce((a,b)=>a+b,0)<minTotal||qty.some(q=>q<minItem)){status.textContent="Bitte Mindestmengen beachten.";btn.disabled=false;return}
    result=await db.rpc("submit_buffet_quantities",{p_token:token,p_item_ids:ids,p_quantities:qty});
  }else{
    const ids=Array.from(document.querySelectorAll(".buffet-auswahl:checked")).map(x=>Number(x.value));
    result=await db.rpc("submit_buffet_selection",{p_token:token,p_item_ids:ids});
  }
  btn.disabled=false;
  if(result.error){console.error(result.error);status.textContent="Speichern nicht möglich.";return}
  status.textContent="✓ Auswahl wurde gespeichert.";
}

(async()=>{if(await ladeVeranstaltung())await ladeBuffet()})();
</script>
</body>
</html>
