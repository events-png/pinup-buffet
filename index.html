<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>pin-up | Buffetauswahl</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #222;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* KOPFBEREICH */

    #kopfbereich {
      flex-shrink: 0;
      width: 100%;
      padding: 10px 20px;
      background: #ffffff;
      border-bottom: 3px solid #fbbf24;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      z-index: 1000;
    }

    #kopfbereich h1 {
      margin: 3px 0;
      font-size: 24px;
    }

    #kopfbereich p {
      margin: 3px 0;
    }

    #veranstaltung h2 {
      margin: 5px 0;
      font-size: 20px;
    }

    /* AUSWAHL */

    #auswahlzaehler {
      background: #fff8df;
      padding: 8px 12px;
      margin: 8px auto 0;
      border-radius: 8px;
      max-width: 800px;
      border: 1px solid #fbbf24;
    }

    #zaehlerinhalt {
      margin-top: 5px;
      line-height: 1.5;
    }

    #auswahlmengen {
      margin-bottom: 5px;
    }

    #preise {
      padding-top: 5px;
      border-top: 1px solid #e5c75c;
    }

    #gesamtpreis {
      font-size: 18px;
      font-weight: bold;
    }

    /* BUFFETBEREICH */

    #buffet {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 5px 25px 50px;
    }

    #buffet h3 {
      margin-top: 20px;
      margin-bottom: 10px;
      border-bottom: 2px solid #fbbf24;
      padding-bottom: 8px;
    }

    #buffet h3:first-child {
      margin-top: 10px;
    }

    label {
      display: block;
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e5e5e5;
    }

    label:hover {
      background: #fff8df;
    }

    input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    /* HANDY */

    @media (max-width: 600px) {
      #kopfbereich {
        padding: 8px;
      }

      #kopfbereich h1 {
        font-size: 19px;
      }

      #veranstaltung h2 {
        font-size: 16px;
      }

      #auswahlzaehler {
        font-size: 12px;
        padding: 6px;
      }

      #gesamtpreis {
        font-size: 15px;
      }

      #buffet {
        padding: 5px 12px 40px;
      }
    }
  </style>
</head>

<body>

  <header id="kopfbereich">

    <h1>pin-up Buffetauswahl</h1>

    <p id="meldung">
      Veranstaltung wird geladen ...
    </p>

    <div id="veranstaltung"></div>

    <div id="auswahlzaehler" hidden>

      <strong>Ihre Auswahl</strong>

      <div id="zaehlerinhalt">

        <div id="auswahlmengen"></div>

        <div id="preise"></div>

      </div>

    </div>

  </header>

  <main id="buffet"></main>

  <script>

    /* SUPABASE */

    const SUPABASE_URL =
      "https://gfhvecfpdfftfkidlfjc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_jB82z-cp1ZCZdZRdaRBBig_QA1d4mft";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* DATEN */

    let gaestezahl = 0;

    const token = new URLSearchParams(
      window.location.search
    ).get("token");


    /* VERANSTALTUNG LADEN */

    async function ladeVeranstaltung() {

      const meldung =
        document.getElementById("meldung");

      if (!token) {

        meldung.textContent =
          "Kein Veranstaltungslink angegeben.";

        return false;
      }

      const { data, error } = await db.rpc(
        "get_event_by_token",
        {
          p_token: token
        }
      );

      if (error || !data || data.length === 0) {

        meldung.textContent =
          "Veranstaltung nicht gefunden.";

        return false;
      }

      const event = data[0];

      gaestezahl =
        Number(event.guest_count) || 0;

      meldung.textContent =
        "Ihre Veranstaltung:";

      const titel =
        document.createElement("h2");

      titel.textContent =
        event.customer_name;

      document
        .getElementById("veranstaltung")
        .appendChild(titel);

      return true;
    }


    /* BUFFET LADEN */

    async function ladeBuffet() {

      const { data, error } = await db.rpc(
        "get_buffet_items"
      );

      if (error) {

        alert(
          "Buffet konnte nicht geladen werden."
        );

        return;
      }

      const bereich =
        document.getElementById("buffet");

      bereich.replaceChildren();

      const kategorien = [
        "Vorspeise",
        "Hauptspeise",
        "Beilage",
        "Dessert"
      ];

      for (const kategorie of kategorien) {

        const titel =
          document.createElement("h3");

        titel.textContent = kategorie;

        bereich.appendChild(titel);

        const gerichte = data.filter(
          item =>
            item.category
              ?.trim()
              .toLowerCase()
            ===
            kategorie.toLowerCase()
        );

        gerichte.forEach(item => {

          const zeile =
            document.createElement("label");

          const checkbox =
            document.createElement("input");

          checkbox.type = "checkbox";

          checkbox.value = item.id;

          checkbox.className =
            "buffet-auswahl";

          checkbox.dataset.category =
            item.category
              .trim()
              .toLowerCase();

          checkbox.addEventListener(
            "change",
            aktualisiereAuswahl
          );

          zeile.appendChild(checkbox);

          zeile.appendChild(
            document.createTextNode(
              " " + item.name
            )
          );

          bereich.appendChild(zeile);

        });
      }

      document
        .getElementById("auswahlzaehler")
        .hidden = false;

      aktualisiereAuswahl();
    }


    /* AUSWAHL UND PREIS */

    function aktualisiereAuswahl() {

      const auswahl =
        document.querySelectorAll(
          ".buffet-auswahl:checked"
        );

      const anzahl = {
        vorspeise: 0,
        hauptspeise: 0,
        beilage: 0,
        dessert: 0
      };

      auswahl.forEach(item => {

        const kategorie =
          item.dataset.category;

        if (kategorie in anzahl) {
          anzahl[kategorie]++;
        }

      });


      /* AUFPREIS PRO PERSON */

      const extraVorspeisen =
        Math.max(
          0,
          anzahl.vorspeise - 4
        );

      const extraHauptspeisen =
        Math.max(
          0,
          anzahl.hauptspeise - 2
        );

      const extraBeilagen =
        Math.max(
          0,
          anzahl.beilage - 3
        );

      const extraDesserts =
        Math.max(
          0,
          anzahl.dessert - 1
        );


      const aufpreis =
        (extraVorspeisen * 5.00) +
        (extraHauptspeisen * 6.50) +
        (extraBeilagen * 5.00) +
        (extraDesserts * 5.00);


      const grundpreis = 31.50;

      const preisProPerson =
        grundpreis + aufpreis;

      const gesamtpreis =
        preisProPerson * gaestezahl;


      /* EURO FORMAT */

      const euro = wert =>
        wert.toLocaleString(
          "de-DE",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        ) + " €";


      /* AUSWAHLMENGEN */

      document.getElementById(
        "auswahlmengen"
      ).innerHTML = `
        Vorspeisen:
        <strong>${anzahl.vorspeise}/4</strong>
        &nbsp; | &nbsp;

        Hauptspeisen:
        <strong>${anzahl.hauptspeise}/2</strong>
        &nbsp; | &nbsp;

        Beilagen:
        <strong>${anzahl.beilage}/3</strong>
        &nbsp; | &nbsp;

        Desserts:
        <strong>${anzahl.dessert}/1</strong>
      `;


      /* PREISE */

      let preisText = `
        Grundpreis:
        ${euro(grundpreis)}
        pro Person
      `;

      if (aufpreis > 0) {

        preisText += `
          &nbsp; | &nbsp;
          Aufpreis:
          <strong>
            + ${euro(aufpreis)}
            pro Person
          </strong>
        `;
      }

      preisText += `
        <br>

        Preis pro Person:
        <strong>
          ${euro(preisProPerson)}
        </strong>

        &nbsp; | &nbsp;

        ${gaestezahl} Personen:

        <span id="gesamtpreis">
          ${euro(gesamtpreis)}
        </span>
      `;

      document.getElementById(
        "preise"
      ).innerHTML = preisText;
    }


    /* START */

    async function starten() {

      const gefunden =
        await ladeVeranstaltung();

      if (gefunden) {

        await ladeBuffet();

      }
    }

    starten();

  </script>

</body>

</html>
