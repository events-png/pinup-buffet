<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pin-up | Catering-Auswahl (aktuell)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:3px solid #fbbf24;padding:10px 18px;text-align:center;z-index:5;box-shadow:0 2px 8px #0001}
h1{font-size:24px;margin:0 0 8px}main{max-width:850px;margin:auto;padding:15px 20px 60px}
h2{font-size:18px;border-bottom:2px solid #fbbf24;padding-bottom:8px;margin-top:26px}
.item{display:flex;gap:10px;align-items:center;background:#fff;padding:10px;border:1px solid #ddd;border-radius:6px;margin:7px 0}
.item span{flex:1}input{padding:8px;border:1px solid #aaa;border-radius:5px}
input[type=number]{width:90px}button{background:#fbbf24;border:0;padding:11px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
button:disabled,input:disabled{opacity:.55;cursor:not-allowed}#status{padding:10px 0}
small{color:#555}#auswahlzaehler{background:#fff8df;padding:9px 12px;margin:8px auto 0;border-radius:8px;max-width:850px;border:1px solid #fbbf24;line-height:1.45}#speichern,#finalisieren{margin-top:7px;padding:8px 18px}#finalisieren{background:#222;color:#fff;margin-left:6px}#speicherstatus{margin-top:6px;font-weight:bold}#speichern:disabled,#finalisieren:disabled{opacity:.5}@media(max-width:600px){main{padding:12px}h1{font-size:20px}}
</style>
</head>
<body>
<header><h1>pin-up Catering-Auswahl</h1><div id="event">Anfrage wird geladen ...</div><div id="auswahlzaehler"><strong>Ihre Auswahl</strong><div id="auswahlmengen">Auswahl wird geladen ...</div><button id="speichern" type="button">Auswahl speichern</button><button id="finalisieren" type="button">Catering-Auswahl übermitteln</button><div id="speicherstatus" role="status"></div></div></header>
<main><p id="deadline"></p><div id="categories"></div></main>
<script>
const db=supabase.createClient("https://gfhvecfpdfftfkidlfjc.supabase.co","sb_publishable_jB82z-cp1ZCZdZRdaRBBig_QA1d4mft");
const token=new URLSearchParams(location.search).get("token");
const $=id=>document.getElementById(id);
const categories={
 "canapes":"Canapés","fingerfood":"Fingerfood","dessert":"Dessert im Glas",
 "geschirr":"Geschirr & Besteck","mobiliar":"Mobiliar",
 "tischwaesche":"Tischwäsche","personal":"Personal"
};
let data=null,editable=false;
const fmtDate=d=>d?new Date(d+"T12:00:00").toLocaleDateString("de-DE"):"-";
async function load(){
 if(!token){$("event").textContent="Kein gültiger Auswahl-Link.";return}
 const result=await db.rpc("get_catering_by_token",{p_token:token});
 if(result.error||!result.data){$("event").textContent="Anfrage nicht gefunden.";return}
 data=result.data;
 const catalogResponse=await db.rpc("get_catering_catalog_by_token",{p_token:token});
 const catalog= catalogResponse.error ? [] : (catalogResponse.data||[]);
 $("event").textContent=data.customer_name+" · "+fmtDate(data.event_date)+" · "+data.guest_count+" Personen";
 const until=new Date(data.editable_until);
 editable=data.status==='open'&&Number.isFinite(until.getTime())&&Date.now()<=until.getTime();
 $("deadline").textContent="Änderungsfrist: "+(data.editable_until?until.toLocaleString("de-DE"):"nicht verfügbar")+
  (data.status==="finalized"?" · Verbindlich übermittelt. Keine weiteren Änderungen möglich.":editable?" · Sie können die Auswahl bis dahin ändern.":" · Die Auswahl ist abgeschlossen.");
 const container=$("categories");
 for(const key of data.categories||[]){
  const section=document.createElement("section");
  const heading=document.createElement("h2");heading.textContent=categories[key]||key;
  if(key==="canapes"||key==="fingerfood"){
   const note=document.createElement("small");note.style.cssText="display:inline-block;margin-left:14px;font-size:13px;font-weight:normal;line-height:1.4;vertical-align:middle";
   note.textContent="Mindestbestellmenge: 30 Stück | Mindestens 10 Stück pro Sorte";heading.append(note);
  }
  section.append(heading);
  const rows=document.createElement("div");rows.dataset.category=key;section.append(rows);
  const entries=(data.items||[]).filter(item=>item.category===key);
  if((key==="fingerfood"||key==="canapes"||key==="dessert"||key==="geschirr"||key==="mobiliar"||key==="tischwaesche"||key==="personal") && catalog.some(item=>item.category===key)){
   for(const choice of catalog.filter(item=>item.category===key)){
    const saved=entries.find(item=>item.item_name===choice.name);
    addRow(rows,{item_name:choice.name,quantity:saved?.quantity||0,notes:saved?.notes||""},true,key==="personal");
   }
  }else{
   for(const item of entries)addRow(rows,item);
  }
  container.append(section);
 }
 $("auswahlzaehler").hidden=false;
 $("speichern").disabled=!editable;
 $("finalisieren").disabled=!editable;
 $("speichern").onclick=()=>save(false);
 $("finalisieren").onclick=()=>save(true);
 updateCount();
}
function addRow(rows,item={},fixed=false,personnel=false){
 const box=document.createElement("div");box.className="item";
 const name=document.createElement("input");name.placeholder="Artikel / Sorte";name.value=item.item_name||"";
 name.style.flex="1";name.maxLength=160;name.disabled=fixed||!editable;
 const qty=document.createElement("input");qty.type="number";qty.min="0";qty.max="100000";qty.step="1";
 qty.value=item.quantity||0;qty.disabled=!editable;qty.setAttribute("aria-label","Menge");
 if(fixed){const title=document.createElement("span");title.textContent=item.item_name;box.append(title,qty);box.dataset.name=item.item_name;}else{box.append(name,qty)}
 if(personnel){
  const from=document.createElement("input");from.type="time";from.setAttribute("aria-label","Beginn");from.value=(item.notes||"").match(/von (\d{2}:\d{2})/)?.[1]||"";from.disabled=!editable;
  const until=document.createElement("input");until.type="time";until.setAttribute("aria-label","Ende");until.value=(item.notes||"").match(/bis (\d{2}:\d{2})/)?.[1]||"";until.disabled=!editable;
  const label=document.createElement("small");label.textContent="von / bis";box.append(label,from,until);
 }
 rows.append(box);
 qty.addEventListener("input",updateCount);
}
function updateCount(){
 let count=0,positions=0;
 document.querySelectorAll("#categories input[type=number]").forEach(input=>{const quantity=Number(input.value)||0;if(quantity>0){count+=quantity;positions++}});
 $("auswahlmengen").textContent=positions+" Positionen · "+count+" Stück/Einheiten";
}
async function save(finalize=false){
 const items=[];
 for(const section of document.querySelectorAll("[data-category]")){
  for(const row of section.querySelectorAll(".item")){
   const inputs=row.querySelectorAll("input");const name=row.dataset.name||inputs[0].value.trim();
   const qty=Number((row.dataset.name?inputs[0]:inputs[1]).value);
   if(!name&&!qty)continue;
   if(!name||!Number.isInteger(qty)||qty<0||qty>100000){
    $("speicherstatus").textContent="Bitte Artikel und gültige Mengen angeben.";return;
   }
   if(qty>0){
    let notes="";
    if(section.dataset.category==="personal"){
     const times=row.querySelectorAll('input[type="time"]');
     if(times.length!==2||!times[0].value||!times[1].value){$("speicherstatus").textContent="Bitte beim Personal Beginn und Ende eintragen.";return;}
     notes="von "+times[0].value+" bis "+times[1].value;
    }
    items.push({category:section.dataset.category,item_name:name,quantity:qty,notes});
   }
  }
 }
 $("speichern").disabled=true;$("finalisieren").disabled=true;$("speicherstatus").textContent="Auswahl wird gespeichert ...";
 if(finalize&&!confirm("Möchten Sie Ihre Catering-Auswahl übermitteln? Danach sind keine Änderungen mehr möglich, auch wenn die 14-Tage-Frist noch nicht erreicht ist.")){$("speichern").disabled=false;$("finalisieren").disabled=false;return;}
 const result=await db.rpc("save_catering_by_token",{p_token:token,p_items:items});
 if(!result.error&&finalize){
  const submitted=await db.rpc("submit_catering_by_token",{p_token:token});
  if(submitted.error){result.error=submitted.error;}
 }
 $("speichern").disabled=false;$("finalisieren").disabled=false;
 $("speicherstatus").textContent=result.error?"Speichern/Übermitteln nicht möglich: "+result.error.message:
  (finalize?"Ihre Catering-Auswahl wurde verbindlich übermittelt. Änderungen sind jetzt nicht mehr möglich.":"Ihre Auswahl wurde gespeichert. Sie können sie bis zum Fristablauf erneut bearbeiten.");
 if(!result.error&&finalize){editable=false;document.querySelectorAll("#categories input, #categories button").forEach(el=>el.disabled=true);$("speichern").disabled=true;$("finalisieren").disabled=true;$("deadline").textContent="Catering-Auswahl verbindlich übermittelt · Keine weiteren Änderungen möglich.";}
}
load();
</script>
</body></html>
